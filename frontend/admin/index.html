<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c6d1d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="문의관리" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>e-PAPER 문의 관리</title>
  <link rel="manifest" href="/admin/manifest.webmanifest" />
  <link rel="icon" href="/admin/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/admin/icons/icon-192.png" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">e-PAPER Admin</p>
        <h1>문의 관리</h1>
      </div>
      <button class="btn btn-ghost" type="button" id="logout-btn" hidden>로그아웃</button>
    </header>

    <section class="panel login-panel" id="login-panel">
      <h2>관리자 로그인</h2>
      <p class="muted">API 키를 입력하면 문의 목록 조회와 새 접수 알림을 받을 수 있습니다.</p>
      <label class="field">
        <span>API 키</span>
        <input id="api-key-input" type="password" autocomplete="current-password" placeholder="ADMIN_API_KEY" />
      </label>
      <label class="field">
        <span>API 주소</span>
        <input id="api-url-input" type="url" placeholder="https://eslhomep-production.up.railway.app" />
      </label>
      <button class="btn btn-primary" type="button" id="login-btn">시작</button>
      <p class="status" id="login-status" role="status"></p>
    </section>

    <section class="panel dashboard" id="dashboard" hidden>
      <div class="stats">
        <div class="stat">
          <span>전체 문의</span>
          <strong id="total-count">0</strong>
        </div>
        <div class="stat">
          <span>최신 ID</span>
          <strong id="latest-id">0</strong>
        </div>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary" type="button" id="refresh-btn">새로고침</button>
        <button class="btn btn-ghost" type="button" id="notify-btn">알림 켜기</button>
      </div>
      <p class="mobile-tip" id="mobile-tip" hidden></p>
      <p class="push-status" id="push-status" hidden></p>

      <p class="status" id="dashboard-status" role="status"></p>
      <ul class="inquiry-list" id="inquiry-list"></ul>
    </section>
  </div>

  <script src="/admin/js/config.js"></script>
  <script src="/admin/js/app.js" type="module"></script>
</body>
</html>
